<!-- backend/app/core/email_templates/base.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Farm Manager{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1e293b;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
        }
        .email-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .email-container {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .email-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .email-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .email-header .subtitle {
            font-size: 16px;
            opacity: 0.8;
            font-weight: 400;
        }
        .email-header .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        .email-body {
            padding: 40px 30px;
        }
        .email-body h2 {
            font-size: 22px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 16px;
        }
        .email-body p {
            margin-bottom: 16px;
            color: #334155;
        }
        .email-body .highlight-box {
            background: #f8fafc;
            border-left: 4px solid #1e293b;
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .email-body .highlight-box strong {
            color: #0f172a;
        }
        .email-body .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 24px;
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: 8px;
            margin: 16px 0;
        }
        .email-body .info-grid .label {
            color: #64748b;
            font-size: 14px;
        }
        .email-body .info-grid .value {
            color: #0f172a;
            font-weight: 500;
        }
        .email-body .button {
            display: inline-block;
            padding: 12px 28px;
            background: #1e293b;
            color: white !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin: 16px 0 8px 0;
            transition: background 0.2s;
        }
        .email-body .button:hover {
            background: #0f172a;
        }
        .email-body .button-secondary {
            background: #e2e8f0;
            color: #1e293b !important;
        }
        .email-body .button-secondary:hover {
            background: #cbd5e1;
        }
        .email-body .warning {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 14px;
            color: #991b1b;
        }
        .email-body .success {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 14px;
            color: #166534;
        }
        .email-body .divider {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 24px 0;
        }
        .email-footer {
            padding: 24px 30px;
            background: #f8fafc;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
        }
        .email-footer a {
            color: #1e293b;
            text-decoration: none;
        }
        .email-footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .email-body {
                padding: 24px 16px;
            }
            .email-header {
                padding: 24px 16px;
            }
            .email-header h1 {
                font-size: 22px;
            }
            .info-grid {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-container">
            <!-- Header -->
            <div class="email-header">
                <span class="logo-icon">🐄</span>
                <h1>Farm Manager</h1>
                <div class="subtitle">{% block header_subtitle %}Gestion d'élevage intelligent{% endblock %}</div>
            </div>

            <!-- Body -->
            <div class="email-body">
                {% block content %}{% endblock %}
            </div>

            <!-- Footer -->
            <div class="email-footer">
                <p>
                    &copy; 2024 Farm Manager - Tous droits réservés<br>
                    <a href="{{ frontend_url }}">{{ frontend_url }}</a>
                </p>
                <p style="margin-top: 8px; font-size: 12px; color: #94a3b8;">
                    Cet email a été envoyé automatiquement, merci de ne pas y répondre.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
